<html>
<html lang="en">
<head>
  <title>Scan Link</title>
</head>
<body>
  <h2>Linksite/h2>
  <div id="output"></div>

  <script>
    fetch('./INB.json')
      .then(response => {
        if (!response.ok) {
          throw new Error('Unable to load data');
        }
        return response.json();
      })
      .then(data => {
        document.getElementById('output').textContent =
          `${data.name}, ${data.age}, ${data.city}`;
      })
      .catch(error => {
        console.error(error);
        document.getElementById('output').textContent =
          'Failed to load data.';
      });
  </script>
</body>
</html>
